name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Only GitHub-owned actions are allowed by the organisation's Actions policy,
# so PHP comes from the runner image and the release is published with the gh CLI.
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select PHP 8.2
        run: |
          set -euo pipefail
          if [ -x /usr/bin/php8.2 ]; then
            sudo update-alternatives --set php /usr/bin/php8.2
          else
            echo "PHP 8.2 not present on this runner image; using the default PHP."
          fi
          php -v | head -n 1
          composer --version

      - name: Validate tag matches info.xml version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          # Parse XML with PHP (more robust than regexing XML with sed)
          VERSION="$(php -r '$x=simplexml_load_file("info.xml"); echo trim((string)$x->version);')"
          echo "Tag version: ${TAG_VERSION}"
          echo "info.xml version: ${VERSION}"
          if [ "${VERSION}" != "${TAG_VERSION}" ]; then
            echo "ERROR: tag (${TAG_VERSION}) does not match info.xml version (${VERSION})" >&2
            exit 1
          fi

      - name: Build release zip
        run: |
          chmod +x ./build-release.sh
          ./build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" vitid_auth0-v*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
